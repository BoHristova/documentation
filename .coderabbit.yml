# .coderabbit.yml
reviews:
  path_filters:
    - "!website/**"
  poem: false
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: false
  collapse_walkthrough: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  enable_prompt_for_ai_agents: false
  path_instructions:
    - path: "website/**/*.md"
      instructions: |
        When reviewing this file, look at the Vale annotations from the GitHub Checks. For each Vale error or warning annotation on a changed line: read the flagged line in context and judge whether the finding is a real issue. Vale sometimes reports false positives — only create a committable suggestion if it is a genuine error or warning. If it is a false positive, add a comment explaining why it is a false positive and how to avoid it (for example, by rephrasing or by adding the term to the appropriate Vale vocabulary).
  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000