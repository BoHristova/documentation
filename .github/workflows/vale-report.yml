name: Vale Report

on:
  workflow_run:
    workflows: ["Vale Lint"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  report:
    name: Post Vale results
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Vale results
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vale-results
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          path: .vale-artifacts

      - name: Get PR number
        id: pr-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(echo "$PULL_REQUESTS_JSON" | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "Searching for PR by head SHA..."
            PR_NUMBER=$(gh pr list --repo ${{ github.repository }} --state open \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | head -1)
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Render report
        if: steps.pr-number.outputs.pr_number != ''
        run: |
          python3 .github/scripts/vale_render.py \
            --input .vale-artifacts/vale_output.json \
            --ranges .vale-artifacts/line_ranges.txt \
            --output vale_report.md \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr-number.outputs.pr_number }}" \
            --branch "${{ github.event.workflow_run.head_branch }}"

      - name: Post sticky comment
        if: steps.pr-number.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gardener-vale-results
          path: vale_report.md
          number: ${{ steps.pr-number.outputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -rf .vale-artifacts vale_report.md
