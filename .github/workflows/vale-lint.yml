name: Vale Lint

on:
  pull_request:
    paths:
      - 'website/**/*.md'
      - '.vale.ini'
      - '.github/styles/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vale:
    name: Lint prose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            website/**/*.md
          files_ignore: |
            website/about/legal-disclosure.md
            website/archived/**

      - name: Install Vale
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          wget -qO vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.14.1/vale_3.14.1_Linux_64-bit.tar.gz
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale

      - name: Fetch PR diff line ranges
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            | jq -r '.[] | select(.status != "removed") | .filename as $path | .patch // "" | scan("@@ -[0-9,]* \\+([0-9]+),?([0-9]*) @@") | [$path, .[0], (if .[1] == "" then "1" else .[1] end)] | join("|")' \
            > line_ranges.txt || true

      - name: Run Vale
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then
            FILES="website/"
          fi
          vale --minAlertLevel=warning --output=JSON $FILES > vale_output.json || true

      - name: Upload results
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vale-results
          path: |
            vale_output.json
            line_ranges.txt
          retention-days: 1
