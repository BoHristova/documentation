StylesPath = .vale/styles
MinAlertLevel = warning

Packages = https://github.com/elastic/vale-rules/releases/latest/download/elastic-vale.zip

Vocab = GardenerTerms, ThirdPartyProducts, TechJargon

[formats]
mdx = md

[*.md]
BasedOnStyles = Elastic, Gardener

TokenIgnores = (<[^>]+>), (\[.*?\]\(.*?\)), (`[^`]+`), (v[0-9]+(?:\.[0-9]+)*(?:alpha[0-9]+|beta[0-9]+)?), (/[^\s]+), (https?://\S+), ([a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]+), (\w+\(s\)), (\*+\w+\**|\w+\*+)

BlockIgnores = (?s)(\{\{.*?\}\})
